services:
  qdrant:
    image: qdrant/qdrant:v1.11.4
    container_name: qdrant_memory
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped
    # L'image qdrant n'embarque ni curl ni wget (seulement bash) et l'endpoint
    # est /readyz (pas /health) — probe HTTP via /dev/tcp.
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend STT alternatif (CPU) — requis seulement si arcos.stt.backend=FASTER_WHISPER.
  # Derrière un profil : ne démarre pas par défaut (précharge large-v3-turbo, ~2 Go RAM).
  # Démarrer avec : docker compose --profile faster-whisper up -d
  faster-whisper:
    profiles: ["faster-whisper"]
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: faster-whisper-container
    ports:
      - "8000:8000"
    environment:
      - WHISPER__MODEL=deepdml/faster-whisper-large-v3-turbo-ct2
      - WHISPER__DEVICE=cpu
      - WHISPER__COMPUTE_TYPE=int8
      - WHISPER__TTL=-1
      - PRELOAD_MODELS=["deepdml/faster-whisper-large-v3-turbo-ct2"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # ── GPU-accelerated STT (Vulkan) ────────────────────────────────────────────
  # whisper.cpp v1.8.4+ with Vulkan — AMD iGPU, dGPUs, Intel Arc
  # Model is downloaded at docker build time (~1.5 GB).
  #
  whisper-cpp:
     image: saririus/whisper-cpp-vulkan:latest
     container_name: whisper-cpp-container
     ports:
       - "8090:8080"
     devices:
       - /dev/dri:/dev/dri
     # Encoder mel-context cap. Default is 1500 mel-frames (30s) regardless of input length.
     # WER matrix on real French speech (SttAccuracyBench, 2026-07-02): 250 -> 43% mean WER
     # (65% on >5s utterances, hallucination loops that also blow up decode latency);
     # 750 (15s) -> 4.9% WER, identical to the 1500 baseline, at ~half its latency.
     # Values below ~700 hallucinate even on short audio — do not lower this again without
     # re-running SttAccuracyBench. Per-request audio_ctx override is honored by this server.
     command: [
       "--host", "0.0.0.0",
       "--port", "8080",
       "--model", "/models/ggml-large-v3-turbo.bin",
       "--language", "fr",
       "--no-timestamps",
       "--audio-ctx", "750"
     ]
     restart: unless-stopped
     healthcheck:
       test: ["CMD", "curl", "-f", "http://localhost:8080/"]
       interval: 30s
       timeout: 10s
       retries: 5
       start_period: 30s


  radicale:
    image: tomsquest/docker-radicale:latest
    container_name: radicale
    ports:
      - "5232:5232"
    volumes:
      - radicale_data:/data
    environment:
      - TAKE_FILE_OWNERSHIP=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5232/.web"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# ── Note de déploiement ───────────────────────────────────────────────────────
# L'app ARCOS tourne NATIVEMENT (hors Docker), pas dans ce compose.
# Elle a besoin d'un accès direct au matériel de l'hôte : audio (PipeWire/
# PulseAudio), Bluetooth (D-Bus système) et un terminal interactif (TUI Lanterna).
# Containeriser l'app forçait privileged + network_mode host + montage des
# sockets audio/D-Bus — beaucoup de complexité pour zéro isolation réelle.
# Ce compose ne fournit donc que les services réseau dont l'app dépend ; elle les
# joint via localhost:<port> (ports publiés ci-dessus).
#
# Lancement (canonique) :
#   ./scripts/run-arcos.sh      # compose up -d + attente santé + lancement du jar
#
# Lancement manuel (dev) :
#   docker compose up -d        # services réseau (qdrant, whisper-cpp, radicale)
#   mvn spring-boot:run         # app ARCOS, dans un vrai terminal
#
# faster-whisper est derrière un profil (voir le service ci-dessus) ; requis
# seulement si arcos.stt.backend=FASTER_WHISPER.

volumes:
  radicale_data:
